name: Sync publications from Notion

on:
  schedule:
    # Every six hours (UTC). Adjust or remove as you like.
    - cron: '0 */6 * * *'
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  repository_dispatch:      # optional: fired by a Notion automation / webhook
    types: [notion-sync]

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull database from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data assets)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "notion-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync publications from Notion"
          git push
