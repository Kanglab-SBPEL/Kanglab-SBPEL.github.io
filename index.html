<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Synthetic Biology and BioProcess Engineering Lab (KANG Lab), Department of Chemical Engineering, Kyung Hee University.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap">
<title>KANG LAB · Synthetic Biology and BioProcess Engineering Lab</title>
<style>
  :root{
    --bar:#262626;
    --green:#4a7a2e;
    --band:#eeeeee;
    --ink:#202124;
    --grey:#5f6368;
    --faint:#9aa0a6;
    --rule:#dadce0;
    --red:#a83226;
    --sans:"Roboto", Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --serif:"Playfair Display", "Times New Roman", serif;
    --body-serif:"Lora", Georgia, "Times New Roman", serif;
    --wrap:810px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
       -webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{color:var(--green);}
  a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{transition:none!important;} }

  /* ---------- header ---------- */
  .bar{position:sticky;top:0;z-index:60;background:var(--bar);}
  .bar-in{max-width:1600px;margin:0 auto;height:48px;padding:0 18px;display:flex;align-items:center;
          justify-content:space-between;gap:20px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand .mark{width:30px;height:30px;object-fit:contain;}
  .brand .mark-ph{width:30px;height:30px;border:1px dashed rgba(255,255,255,.4);border-radius:3px;}
  .brand b{color:#fff;font-size:14.5px;font-weight:700;letter-spacing:.05em;}
  nav.top{display:flex;align-items:center;gap:20px;}
  nav.top a{color:rgba(255,255,255,.88);font-size:13.5px;text-decoration:none;padding:4px 2px;}
  nav.top a:hover{color:#fff;}
  nav.top a[aria-current="page"]{color:#fff;font-weight:700;}
  .searchbtn{background:none;border:0;padding:4px;cursor:pointer;line-height:0;}
  .searchbtn svg{width:17px;height:17px;fill:rgba(255,255,255,.88);}
  .searchbox{display:none;background:#1b1b1b;border-top:1px solid #333;}
  .searchbox.open{display:block;}
  .searchbox input{width:100%;max-width:1600px;margin:0 auto;display:block;background:transparent;border:0;
                   color:#fff;font-family:var(--sans);font-size:14px;padding:12px 20px;}
  .searchbox input::placeholder{color:#8a8a8a;}
  @media (max-width:760px){ nav.top{gap:12px;} nav.top a{font-size:12px;} .brand b{font-size:12.5px;} }

  /* ---------- banner ---------- */
  .banner{position:relative;height:200px;display:grid;place-items:center;overflow:hidden;
          background:#3c4a3a;}
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .banner::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38);}
  .banner .ph{position:absolute;inset:0;background:
      linear-gradient(135deg,#44523f 0%,#2f3a2c 55%,#3d4a38 100%);}
  .banner h1{position:relative;z-index:2;margin:0;color:#fff;text-align:center;padding:0 20px;
             text-shadow:0 1px 3px rgba(0,0,0,.45);}
  .banner.home h1{font-family:var(--sans);font-weight:700;font-size:clamp(20px,3.2vw,34px);}
  .banner.sub h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.4vw,44px);}
  .banner .phlabel{position:absolute;z-index:3;bottom:8px;right:12px;font-family:ui-monospace,monospace;
                   font-size:9.5px;letter-spacing:.12em;color:rgba(255,255,255,.5);}

  /* ---------- bands & wrap ---------- */
  .band{background:var(--band);padding:24px 20px;}
  .band h2{margin:0;text-align:center;font-family:var(--serif);font-weight:700;color:var(--green);
           font-size:clamp(21px,2.6vw,27px);}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:30px 20px 34px;}
  .wrap.wide{max-width:1000px;}

  /* ---------- home ---------- */
  .intro{font-size:14px;font-weight:700;line-height:1.62;text-align:justify;margin:0 0 26px;}
  .contacts{text-align:center;font-weight:700;font-size:14px;line-height:1.85;}
  .contacts a{text-decoration:underline;}

  /* ---------- figures & placeholders ---------- */
  figure{margin:0 0 8px;}
  .ph-box{background:#f4f4f4;border:1px solid var(--rule);border-radius:2px;display:grid;place-items:center;
          color:var(--faint);font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
          text-transform:uppercase;}
  .ph-fig{aspect-ratio:16/6;}
  .ph-flow{aspect-ratio:16/3;}
  .ph-photo{aspect-ratio:3/4;}
  .ph-sq{aspect-ratio:4/3;}

  /* ---------- research ---------- */
  .ov-sub{text-align:center;font-family:var(--body-serif);font-style:italic;color:var(--green);
          font-size:clamp(15px,2vw,19px);line-height:1.5;margin:0 0 26px;}
  .r-body{font-family:var(--body-serif);font-size:15px;line-height:1.78;text-align:justify;}
  .r-body sub, .r-body sup{line-height:0;}
  .topic{padding-top:30px;margin-top:30px;border-top:1px solid var(--rule);}
  .topic > h3{margin:0 0 22px;font-family:var(--body-serif);font-style:italic;font-weight:700;
              color:var(--green);font-size:16.5px;line-height:1.4;display:flex;gap:10px;}
  .topic > h3::before{content:"▪";color:var(--ink);font-style:normal;font-size:11px;line-height:1.9;}
  .topic .side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:center;}
  @media (max-width:800px){ .topic .side{grid-template-columns:1fr;} }

  /* ---------- people ---------- */
  .pi{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;}
  @media (max-width:760px){ .pi{grid-template-columns:1fr;} .pi .shot{max-width:250px;margin:0 auto;} }
  .pi .who{text-align:center;}
  .pi .who h3{margin:0;font-size:20px;font-weight:700;}
  .pi .who .rank{font-weight:700;font-size:15px;margin:2px 0 14px;}
  .pi .who .affil{font-weight:700;font-size:13.5px;margin:0;}
  .pi .who .addr{font-size:13.5px;margin:0 0 14px;}
  .pi .who .cont{font-size:13.5px;margin:0 0 6px;}
  .pi .who .links{font-weight:700;font-size:13.5px;margin:0 0 16px;}
  .pi .who .links a{text-decoration:underline;}
  .pi ul{margin:0;padding:0;list-style:none;text-align:left;}
  .pi ul li{font-weight:700;font-size:13px;line-height:1.75;display:flex;gap:9px;}
  .pi ul li::before{content:"▪";color:var(--ink);font-size:10px;line-height:1.9;}

  .members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 34px;margin-top:44px;}
  @media (max-width:700px){ .members{grid-template-columns:1fr;} }
  .member{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:start;}
  .member .shot{width:110px;}
  .member h4{margin:0 0 8px;font-size:15px;font-weight:700;}
  .member .role{font-size:12.5px;font-weight:700;margin:0;}
  .member p{margin:0;font-size:12.5px;color:var(--ink);line-height:1.5;}
  .member .res{display:flex;gap:.35em;}
  .member .res .lbl{flex:none;}
  .member .res .vals{min-width:0;}
  .member .res .vals span{display:block;}

  .roster{width:100%;border-collapse:collapse;margin-top:4px;}
  .roster td{padding:2px 0;font-size:13px;vertical-align:top;}
  .roster td.n{font-weight:700;white-space:nowrap;padding-right:24px;}
  .roster td.i{font-weight:700;font-size:12px;padding-top:4px;}

  /* ---------- publications (year-rail style) ---------- */
  .pubbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
          margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--rule);}
  .tabs{display:flex;gap:6px;}
  .tabs button{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
               background:transparent;border:1px solid var(--rule);color:var(--grey);
               padding:6px 11px;border-radius:2px;cursor:pointer;}
  .tabs button:hover{color:var(--ink);border-color:var(--faint);}
  .tabs button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;}
  .pubmeta{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint);
           font-variant-numeric:tabular-nums;}
  .pubnote{font-size:12.5px;color:var(--grey);margin:18px 0 0;}
  .pubyear{display:grid;grid-template-columns:70px minmax(0,1fr);gap:0 26px;}
  @media (max-width:640px){ .pubyear{grid-template-columns:1fr;gap:4px;} }
  .pubyear .yr{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--faint);
               letter-spacing:.06em;font-variant-numeric:tabular-nums;padding-top:17px;}
  .pubyear ol{list-style:none;margin:0;padding:0;}
  .pubyear li{padding:14px 0;border-top:1px solid #ececec;}
  .pubyear li:first-child{border-top:1px solid var(--rule);}
  .pub-t{display:block;font-family:var(--body-serif);font-size:15.5px;line-height:1.4;color:var(--ink);
         text-decoration:none;margin-bottom:5px;}
  a.pub-t:hover{color:var(--green);text-decoration:underline;}
  .pub-a{font-size:13px;color:var(--grey);}
  .pub-a b{color:var(--ink);font-weight:700;}
  .pub-m{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 12px;margin-top:5px;
         font-size:12.5px;color:var(--faint);}
  .pub-m .jr{font-family:var(--body-serif);font-style:italic;font-size:13.5px;color:var(--ink);}
  .pub-m em{font-style:normal;color:#a9761a;font-family:ui-monospace,monospace;font-size:10.5px;
            letter-spacing:.1em;text-transform:uppercase;}
  .pub-m .doi{font-family:ui-monospace,monospace;font-size:11px;}
  .pubempty{color:var(--grey);font-size:13px;}

  /* ---------- gallery ---------- */
  .gitem{padding:28px 0;border-bottom:1px solid var(--rule);}
  .gitem:last-child{border-bottom:0;}
  .gitem .row{display:grid;gap:24px;align-items:start;}
  .gitem.left .row{grid-template-columns:minmax(0,2fr) minmax(0,1fr);}
  .gitem.center .row{grid-template-columns:1fr;}
  @media (max-width:800px){ .gitem.left .row{grid-template-columns:1fr;} }
  .gshots{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .gitem h3{margin:0 0 6px;font-family:var(--serif);font-weight:700;font-size:20px;}
  .gitem .yr{font-family:var(--serif);font-weight:700;font-size:20px;margin:0;}
  .gitem .ttl{color:var(--red);}
  .gitem p{font-size:13.5px;line-height:1.7;margin:8px 0 0;}
  .gitem.center .cap{text-align:center;margin-bottom:16px;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--rule);}
  .foot{max-width:var(--wrap);margin:0 auto;padding:24px 20px 40px;display:flex;align-items:flex-end;
        justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .foot p{margin:0;font-size:11px;line-height:1.6;color:#3c4043;}
  .foot .khu{width:250px;}
  .foot .khu .ph-box{aspect-ratio:5/1.4;}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#home" aria-label="KANG LAB home">
      <span id="brandmark"></span>
      <b id="brandname">KANG LAB</b>
    </a>
    <nav class="top" id="topnav" aria-label="Pages"></nav>
  </div>
  <div class="searchbox" id="searchbox">
    <input type="search" id="searchinput" placeholder="Search publications…" aria-label="Search publications">
  </div>
</header>

<main id="page" aria-live="polite"></main>

<footer>
  <div class="foot">
    <div id="footlines"></div>
    <div class="khu" id="khulogo"></div>
  </div>
</footer>

<script>
(function(){
  var PAGES = [
    {id:'home',         label:'Home'},
    {id:'research',     label:'Research'},
    {id:'people',       label:'People'},
    {id:'publications', label:'Publications'},
    {id:'gallery',      label:'Gallery'}
  ];
  var C = null, PUBS = [], filter = '', pubTab = 'journal';

  /* ---- helpers ---- */
  var OKTAG = /^(\/?)(i|b|em|strong|sub|sup|br|u|span|a)$/i;
  function rich(s){
    if (s == null) return '';
    return String(s).replace(/<\s*(\/?)([a-zA-Z0-9]+)([^>]*)>/g, function(m, sl, tag, rest){
      if (!OKTAG.test(sl + tag)) return '';
      if (tag.toLowerCase() === 'a' && !sl) {
        var href = (rest.match(/href\s*=\s*["']([^"']*)["']/) || [,''])[1];
        if (/^javascript:/i.test(href)) href = '';
        return '<a href="' + esc(href) + '" target="_blank" rel="noopener">';
      }
      return '<' + sl + tag.toLowerCase() + '>';
    }).replace(/\son\w+\s*=/gi, ' data-x=');
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function img(src, cls, phcls, label){
    if (src) return '<img class="' + cls + '" src="' + esc(src) + '" alt="" loading="lazy">';
    return '<div class="ph-box ' + phcls + '">' + (label || 'image') + '</div>';
  }

  /* ---- chrome ---- */
  function renderChrome(){
    var cur = route();
    document.getElementById('topnav').innerHTML =
      PAGES.map(function(p){
        return '<a href="#' + p.id + '"' + (p.id === cur ? ' aria-current="page"' : '') + '>' + p.label + '</a>';
      }).join('') +
      '<button class="searchbtn" id="searchtoggle" aria-label="Search" aria-expanded="false">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></button>';

    var st = document.getElementById('searchtoggle'), box = document.getElementById('searchbox');
    st.addEventListener('click', function(){
      var open = box.classList.toggle('open');
      st.setAttribute('aria-expanded', String(open));
      if (open) document.getElementById('searchinput').focus();
    });

    var s = C && C.site || {};
    document.getElementById('brandname').textContent = s.short_name || 'KANG LAB';
    document.getElementById('brandmark').innerHTML = s.logo
      ? '<img class="mark" src="' + esc(s.logo) + '" alt="">'
      : '<span class="mark-ph"></span>';
    document.getElementById('footlines').innerHTML =
      (s.footer_lines || []).map(function(l){ return '<p>' + rich(l) + '</p>'; }).join('');
    document.getElementById('khulogo').innerHTML =
      s.khu_logo ? '<img src="' + esc(s.khu_logo) + '" alt="Kyung Hee University">'
                 : '<div class="ph-box" style="aspect-ratio:5/1.4">KHU logo</div>';
  }

  function banner(kind, title){
    var s = C && C.site || {}, src = (s.banners || {})[kind] || '';
    return '<section class="banner ' + (kind === 'home' ? 'home' : 'sub') + '">' +
      (src ? '<img src="' + esc(src) + '" alt="">' : '<div class="ph"></div><span class="phlabel">banner</span>') +
      '<h1>' + rich(title) + '</h1></section>';
  }

  /* ---- pages ---- */
  function pageHome(){
    var s = C.site;
    return banner('home', s.lab_name) +
      '<div class="band"><h2>' + rich(s.home_welcome) + '</h2></div>' +
      '<div class="wrap">' +
        '<p class="intro">' + rich(s.home_intro) + '</p>' +
        '<figure>' + img(s.home_figure, '', 'ph-flow', 'overview figure') + '</figure>' +
      '</div>' +
      '<div class="band"><h2>' + rich(s.contacts_title || 'Contacts') + '</h2></div>' +
      '<div class="wrap"><div class="contacts">' +
        (s.contacts_lines || []).map(function(l){ return '<div>' + rich(l) + '</div>'; }).join('') +
      '</div></div>';
  }

  function pageResearch(){
    var r = C.research;
    return banner('research', 'Research') +
      '<div class="wrap">' +
        '<h2 style="text-align:center;font-family:var(--serif);color:var(--green);font-size:clamp(21px,2.8vw,29px);margin:6px 0 10px;">' +
          rich(r.overview_title) + '</h2>' +
        '<p class="ov-sub">' + rich(r.overview_sub) + '</p>' +
        '<figure>' + img(r.overview_figure, '', 'ph-fig', 'overview figure') + '</figure>' +
        '<p class="r-body" style="margin-top:26px;">' + rich(r.intro) + '</p>' +
        (r.topics || []).map(function(t){
          var fig = '<figure>' + img(t.figure, '', t.layout === 'side' ? 'ph-sq' : 'ph-fig', t.hint || 'figure') + '</figure>';
          var body = '<p class="r-body">' + rich(t.body) + '</p>';
          return '<section class="topic"><h3><span>' + rich(t.title) + '</span></h3>' +
            (t.layout === 'side'
              ? '<div class="side">' + fig + body + '</div>'
              : fig + '<div style="margin-top:22px">' + body + '</div>') +
            '</section>';
        }).join('') +
      '</div>';
  }

  function pagePeople(){
    var p = C.people, pi = p.pi || {};
    return banner('people', 'People') +
      '<div class="band"><h2>Principal Investigator</h2></div>' +
      '<div class="wrap"><div class="pi">' +
        '<div class="shot">' + img(pi.photo, '', 'ph-photo', 'photo') + '</div>' +
        '<div class="who">' +
          '<h3>' + rich(pi.name) + '</h3>' +
          '<p class="rank">' + rich(pi.title) + '</p>' +
          '<p class="affil">' + rich(pi.affil) + '</p>' +
          '<p class="addr">' + rich(pi.address) + '</p>' +
          '<p class="cont">' + rich(pi.contact) + '</p>' +
          '<p class="links">' + (pi.links || []).map(function(l){
             return '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>';
           }).join(', ') + '</p>' +
          '<ul>' + (pi.cv || []).map(function(c){ return '<li><span>' + rich(c) + '</span></li>'; }).join('') + '</ul>' +
        '</div>' +
      '</div>' +
      '<div class="members">' + (p.members || []).map(function(m){
        return '<article class="member">' +
          '<div class="shot">' + img(m.photo, '', 'ph-photo', 'photo') + '</div>' +
          '<div><h4>' + rich(m.name) + '</h4>' +
          '<p class="role">' + rich(m.role) + '</p>' +
          '<p>Email: ' + rich(m.email) + '</p>' +
          ((m.research || []).length ? '<p class="res"><span class="lbl">Research:</span><span class="vals">' +
             m.research.map(function(x){ return '<span>' + rich(x) + '</span>'; }).join('') +
           '</span></p>' : '') + '</div></article>';
      }).join('') + '</div></div>' +
      rosterBlock('Alumni', p.alumni) +
      rosterBlock('Former Lab Members', p.former);
  }

  function rosterBlock(title, rows){
    if (!rows || !rows.length) return '';
    return '<div class="band"><h2>' + esc(title) + '</h2></div>' +
      '<div class="wrap"><table class="roster"><tbody>' +
      rows.map(function(r){
        return '<tr><td class="n">' + rich(r.name) + '</td><td class="i">' + rich(r.info) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function pagePublications(){
    var kinds = [['journal','Journal Publications'],['patent','Patents'],['conference','Conference Presentations'],['book','Book Chapters']];
    var short = {journal:'Journals', patent:'Patents', conference:'Conferences', book:'Book chapters'};
    var present = kinds.filter(function(k){
      return PUBS.some(function(p){ return p.type === k[0]; });
    });
    if (!present.length) present = [['journal','Journals']];
    if (!present.some(function(k){ return k[0] === pubTab; })) pubTab = present[0][0];

    var heading = (present.filter(function(k){ return k[0] === pubTab; })[0] || present[0])[1];
    var rows = PUBS.filter(function(p){ return p.type === pubTab; });
    if (filter) {
      var q = filter.toLowerCase();
      rows = rows.filter(function(p){
        return ((p.title||'') + ' ' + (p.authors||'') + ' ' + (p.journal||'')).toLowerCase().indexOf(q) > -1;
      });
    }
    rows.sort(function(a, b){
      if ((Number(b.year)||0) !== (Number(a.year)||0)) return (Number(b.year)||0) - (Number(a.year)||0);
      return String(a.title||'').localeCompare(String(b.title||''));
    });

    var years = [], by = {};
    rows.forEach(function(p){
      var y = p.year || 'Undated';
      if (!by[y]) { by[y] = []; years.push(y); }
      by[y].push(p);
    });

    var list = years.length ? years.map(function(y){
      return '<div class="pubyear"><div class="yr">' + esc(y) + '</div><ol>' + by[y].map(function(p){
        var link = p.url || (p.doi ? 'https://doi.org/' + p.doi : '');
        var t = link
          ? '<a class="pub-t" href="' + esc(link) + '" target="_blank" rel="noopener">' + rich(p.title) + '</a>'
          : '<span class="pub-t">' + rich(p.title) + '</span>';
        var meta = [];
        if (p.journal)  meta.push('<span class="jr">' + rich(p.journal) + '</span>');
        if (p.tag)      meta.push('<em>' + rich(p.tag) + '</em>');
        if (p.citation) meta.push('<span>' + rich(p.citation) + '</span>');
        if (p.doi)      meta.push('<a class="doi" href="https://doi.org/' + esc(p.doi) +
                                  '" target="_blank" rel="noopener">' + rich(p.doi) + '</a>');
        return '<li>' + t +
               (p.authors ? '<div class="pub-a">' + rich(p.authors) + '</div>' : '') +
               (meta.length ? '<div class="pub-m">' + meta.join('') + '</div>' : '') +
               '</li>';
      }).join('') + '</ol></div>';
    }).join('') : '<p class="pubempty">No matching entries.</p>';

    var tabs = '<div class="tabs" role="group" aria-label="Filter publications">' + present.map(function(k){
      return '<button type="button" data-tab="' + k[0] + '" aria-pressed="' +
             String(k[0] === pubTab) + '">' + (short[k[0]] || k[1]) + '</button>';
    }).join('') + '</div>';

    return banner('publications', 'Publications') +
      '<div class="band"><h2>' + esc(heading) + '</h2></div>' +
      '<div class="wrap">' +
        '<div class="pubbar">' + tabs +
          '<div class="pubmeta">' + rows.length + (rows.length === 1 ? ' entry' : ' entries') + '</div>' +
        '</div>' + list +
        '<p class="pubnote"><sup>&dagger;</sup> co-first author &nbsp;&middot;&nbsp; * corresponding author</p>' +
      '</div>';
  }

  function pageGallery(){
    var items = C.gallery || [];
    return banner('gallery', 'Gallery') +
      '<div class="wrap wide">' + (items.length ? items.map(function(g){
        var shots = '<div class="gshots">' + (g.photos && g.photos.length ? g.photos : ['']).map(function(src){
          return img(src, '', 'ph-sq', 'photo');
        }).join('') + '</div>';
        var cap = '<div class="cap">' +
          (g.year ? '<p class="yr">' + rich(g.year) + '</p>' : '') +
          (g.title ? '<h3 class="ttl">' + rich(g.title) + '</h3>' : '') +
          (g.body ? '<p>' + rich(g.body) + '</p>' : '') + '</div>';
        return '<section class="gitem ' + (g.layout === 'left' ? 'left' : 'center') + '">' +
          (g.layout === 'left' ? '<div class="row">' + shots + cap + '</div>'
                               : cap + '<div class="row">' + shots + '</div>') +
          '</section>';
      }).join('') : '<p class="pubempty">No gallery items yet.</p>') + '</div>';
  }

  /* ---- routing ---- */
  function route(){
    var h = (location.hash || '#home').replace('#', '').split('/')[0];
    return PAGES.some(function(p){ return p.id === h; }) ? h : 'home';
  }
  function render(){
    if (!C) return;
    var r = route();
    renderChrome();
    var html = r === 'research' ? pageResearch()
             : r === 'people' ? pagePeople()
             : r === 'publications' ? pagePublications()
             : r === 'gallery' ? pageGallery()
             : pageHome();
    document.getElementById('page').innerHTML = html;
    document.title = (r === 'home' ? 'KANG LAB' : PAGES.filter(function(p){ return p.id === r; })[0].label + ' · KANG LAB')
                     + ' · Kyung Hee University';
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('.tabs button') : null;
    if (t) { pubTab = t.getAttribute('data-tab'); render(); }
  });
  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'searchinput') {
      filter = e.target.value.trim();
      if (route() !== 'publications') { location.hash = '#publications'; }
      else { render(); document.getElementById('searchbox').classList.add('open'); }
    }
  });

  /* ---- boot ---- */
  function boot(content, pubs){
    C = content;
    PUBS = (pubs && pubs.items) || [];
    render();
  }
  Promise.all([
    fetch('data/content.json', {cache:'no-cache'}).then(function(r){ return r.json(); }),
    fetch('data/publications.json', {cache:'no-cache'}).then(function(r){ return r.json(); }).catch(function(){ return {items:[]}; })
  ]).then(function(a){ boot(a[0], a[1]); })
   .catch(function(){
     if (window.__CONTENT__) boot(window.__CONTENT__, window.__PUBS__ || {items:[]});
     else document.getElementById('page').innerHTML =
       '<div class="wrap"><p class="pubempty">Content could not be loaded.</p></div>';
   });
})();
</script>
</body>
</html>
